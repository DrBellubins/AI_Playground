<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Falling Sand · Cellular Automata Sandbox</title>
<style>
  :root {
    --bg-0: #141419;
    --bg-1: #1b1b22;
    --panel: #20202a;
    --panel-2: #262632;
    --line: #32323f;
    --line-soft: #2a2a35;
    --text: #e8e8f0;
    --text-dim: #9a9ab0;
    --text-faint: #6b6b82;

    --empty: #1e1e24;
    --sand:  #e9c46a;
    --water: #457b9d;
    --wall:  #6c757d;
    --acid:  #55ff33;

    --accent: #8b8bff;
    --radius: 16px;
    --shadow: 0 18px 50px -18px rgba(0,0,0,0.7);
    font-size: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(1200px 800px at 15% -10%, #20202e 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 120%, #1a1a26 0%, transparent 50%),
      var(--bg-0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 40px;
    gap: 22px;
  }

  .topbar {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.02em; font-weight: 700; }
  .brand h1 .sand { color: var(--sand); }
  .brand .sub {
    color: var(--text-faint);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .fps { color: var(--text-faint); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
  .fps b { color: var(--text-dim); font-weight: 600; }

  .layout {
    width: 100%;
    max-width: 900px;
    display: flex;
    gap: 22px;
    align-items: stretch;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 22px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .canvas-frame {
    position: relative;
    padding: 10px;
    background: #101015;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), inset 0 2px 24px rgba(0,0,0,0.6);
  }
  #canvas {
    display: block;
    width: 400px;
    height: 400px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    touch-action: none;
    background: var(--empty);
  }
  .hint { color: var(--text-faint); font-size: 0.8rem; letter-spacing: 0.02em; }
  .hint kbd {
    font-family: inherit; font-size: 0.72rem;
    background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 1px 6px; color: var(--text-dim);
  }

  .panel {
    flex: 1 1 260px;
    min-width: 260px;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    align-self: stretch;
  }
  .panel section { display: flex; flex-direction: column; gap: 12px; }
  .panel h2 {
    margin: 0; font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint);
  }

  .materials { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mat {
    --c: var(--text-dim);
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    background: var(--bg-1);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    color: var(--text); font: inherit; font-size: 0.92rem; font-weight: 600;
    cursor: pointer; user-select: none;
    transition: transform .08s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .mat .dot {
    width: 16px; height: 16px; border-radius: 5px; background: var(--c);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 0 10px -2px var(--c); flex: 0 0 auto;
  }
  .mat .key {
    margin-left: auto; font-size: 0.7rem; color: var(--text-faint);
    background: var(--bg-0); border: 1px solid var(--line-soft); border-radius: 6px; padding: 1px 6px;
  }
  .mat:hover { transform: translateY(-1px); border-color: var(--line); }
  .mat:active { transform: translateY(0); }
  .mat.active {
    border-color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, var(--bg-1));
    box-shadow: 0 0 0 1px var(--c) inset, 0 0 22px -8px var(--c);
  }
  .mat.active .key { color: var(--text); border-color: var(--c); }
  .mat[data-m="1"] { --c: var(--sand); }
  .mat[data-m="2"] { --c: var(--water); }
  .mat[data-m="3"] { --c: var(--wall); }
  .mat[data-m="4"] { --c: var(--acid); }
  .mat[data-m="0"] { --c: #b9b9c9; }

  .brush-row { display: flex; align-items: center; justify-content: space-between; color: var(--text-dim); font-size: 0.85rem; }
  .brush-row b { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent) var(--fill, 20%), var(--line) var(--fill, 20%));
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: pointer;
  }
  .brush-preview {
    height: 44px; border-radius: 10px; background: var(--empty);
    border: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: center;
  }
  .brush-circle {
    border-radius: 50%; background: var(--sand);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset;
    transition: width .1s ease, height .1s ease, background .1s ease;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg-1); color: var(--text); font: inherit; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: transform .08s ease, border-color .12s ease, background .12s ease;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--line); background: var(--panel-2); }
  .btn:active { transform: translateY(0); }
  .btn.danger:hover { border-color: #b0463f; background: rgba(176,70,63,0.12); }
  .btn.ghost { background: transparent; color: var(--text-dim); }

  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.82rem; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .legend-row .sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .legend-row .lbl { flex: 1; }
  .legend-row .num { color: var(--text-faint); }

  .footer { color: var(--text-faint); font-size: 0.76rem; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Falling <span class="sand">Sand</span></h1>
        <span class="sub">cellular automata sandbox</span>
      </div>
      <div class="fps"><b id="fps">–</b> fps · <span id="gridinfo"></span></div>
    </header>

    <main class="layout">
      <div class="stage">
        <div class="canvas-frame">
          <canvas id="canvas" width="400" height="400"></canvas>
        </div>
        <div class="hint">drag to pour · <kbd>1</kbd>–<kbd>5</kbd> materials · <kbd>Space</kbd> pause · <kbd>C</kbd> clear</div>
      </div>

      <aside class="panel">
        <section>
          <h2>Material</h2>
          <div class="materials" id="materials">
            <button class="mat active" data-m="1"><span class="dot"></span>Sand<span class="key">1</span></button>
            <button class="mat" data-m="2"><span class="dot"></span>Water<span class="key">2</span></button>
            <button class="mat" data-m="3"><span class="dot"></span>Wall<span class="key">3</span></button>
            <button class="mat" data-m="4"><span class="dot"></span>Acid<span class="key">4</span></button>
            <button class="mat" data-m="0" style="grid-column: 1 / -1;"><span class="dot"></span>Eraser<span class="key">5</span></button>
          </div>
        </section>

        <section>
          <h2>Brush Size</h2>
          <div class="brush-row"><span>Radius</span><b id="brushval">4</b></div>
          <input type="range" id="brush" min="1" max="15" value="4" />
          <div class="brush-preview"><div class="brush-circle" id="brushcircle"></div></div>
        </section>

        <section>
          <h2>Actions</h2>
          <div class="actions">
            <button class="btn danger" id="clear">Clear Canvas</button>
            <button class="btn" id="pause">Pause</button>
          </div>
          <button class="btn ghost" id="reset">↻ Reset demo scene</button>
        </section>

        <section>
          <h2>Particles</h2>
          <div class="legend" id="legend">
            <div class="legend-row"><span class="sw" style="background:var(--sand)"></span><span class="lbl">Sand</span><span class="num" id="c-sand">0</span></div>
            <div class="legend-row"><span class="sw" style="background:var(--water)"></span><span class="lbl">Water</span><span class="num" id="c-water">0</span></div>
            <div class="legend-row"><span class="sw" style="background:var(--wall)"></span><span class="lbl">Wall</span><span class="num" id="c-wall">0</span></div>
            <div class="legend-row"><span class="sw" style="background:var(--acid)"></span><span class="lbl">Acid</span><span class="num" id="c-acid">0</span></div>
          </div>
        </section>
      </aside>
    </main>

    <div class="footer">Vanilla HTML · CSS · JS — no libraries. Grid: 200×200 mapped to 400×400 (2px cells).</div>
  </div>

  <script>
  "use strict";
  (function () {
    // ------------------------------------------------------------------
    // Grid constants
    // ------------------------------------------------------------------
    const W = 200;             // simulation grid width  (cells)
    const H = 200;             // simulation grid height (cells)
    const CANVAS = 400;        // pixel canvas size
    const N = W * H;           // total cells

    // Material ids
    const EMPTY = 0, SAND = 1, WATER = 2, WALL = 3, ACID = 4;

    // Base RGB per material id (matches the required palette)
    const RGB = [
      [30, 30, 36],    // EMPTY  #1e1e24
      [233, 196, 106], // SAND   #e9c46a
      [69, 123, 157],  // WATER  #457b9d
      [108, 117, 125], // WALL   #6c757d
      [85, 255, 51]    // ACID   #55ff33
    ];

    // How likely (per frame, per contact) that acid eats an adjacent cell.
    // Keeps dissolution gradual / corrosion-like instead of instant.
    const DISSOLVE_CHANCE = 0.32;
    // Max cells a liquid may spread horizontally per frame (organic look).
    const FLOW_MIN = 1, FLOW_MAX = 4;

    // ------------------------------------------------------------------
    // State
    // ------------------------------------------------------------------
    const grid  = new Uint8Array(N);   // material id per cell
    const moved = new Uint32Array(N);  // frame a cell last moved (anti-teleport)
    const noise = new Float32Array(N); // static per-cell brightness variation
    for (let i = 0; i < N; i++) noise[i] = Math.random();

    let frame = 0;       // monotonically increasing frame counter
    let paused = false;
    let currentMaterial = SAND;
    let brushRadius = 4;

    // ------------------------------------------------------------------
    // Rendering buffers
    // ------------------------------------------------------------------
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    // Offscreen buffer at grid resolution, then blit scaled to the canvas.
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const octx = off.getContext("2d");
    const img = octx.createImageData(W, H);

    // ------------------------------------------------------------------
    // Grid helpers
    // ------------------------------------------------------------------
    function clearGrid() { grid.fill(EMPTY); }
    function fillRect(x0, y0, x1, y1, m) {
      if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
      if (x1 > W - 1) x1 = W - 1; if (y1 > H - 1) y1 = H - 1;
      for (let y = y0; y <= y1; y++) {
        const row = y * W;
        for (let x = x0; x <= x1; x++) grid[row + x] = m;
      }
    }

    // Move a particle from src -> dst (dst must currently be EMPTY or a
    // displaceable liquid, decided by the caller). Marks dst as "moved".
    function move(src, dst) {
      grid[dst] = grid[src];
      grid[src] = EMPTY;
      moved[dst] = frame;
    }
    // Swap two cells (e.g. sand sinking through water). Marks both.
    function swap(src, dst) {
      const t = grid[src]; grid[src] = grid[dst]; grid[dst] = t;
      moved[dst] = frame; moved[src] = frame;
    }

    // Try to slide a falling particle diagonally (down + dx). Returns true
    // on success. Only moves if target is one of the allowed materials.
    function trySlide(x, y, i, dx, allowed) {
      const nx = x + dx;
      if (nx < 0 || nx >= W) return false;
      const t = i + W + dx;              // one row down, one column over
      if (grid[t] === allowed) { move(i, t); return true; }
      return false;
    }

    // Horizontal flow for liquids: travel up to a random distance in
    // direction dx, stopping at the first non-empty cell. Moves the
    // particle to the farthest empty cell reached (classic "spread until
    // blocked"). Returns true if it moved.
    function tryFlow(x, y, i, dx) {
      const maxFlow = FLOW_MIN + ((Math.random() * (FLOW_MAX - FLOW_MIN + 1)) | 0);
      let lastEmpty = -1;
      let nx = x + dx;
      for (let s = 0; s < maxFlow && nx >= 0 && nx < W; s++, nx += dx) {
        if (grid[y * W + nx] === EMPTY) lastEmpty = nx;
        else break;
      }
      if (lastEmpty === -1) return false;
      move(i, y * W + lastEmpty);
      return true;
    }

    // ------------------------------------------------------------------
    // Per-material update rules
    // ------------------------------------------------------------------
    function updateSand(x, y, i) {
      if (y + 1 >= H) return;             // sitting on the floor
      const below = i + W;
      const b = grid[below];
      if (b === EMPTY) { move(i, below); return; }          // fall
      if (b === WATER || b === ACID) { swap(i, below); return; } // sink, displace up
      // Blocked (sand or wall below): slide diagonally at random.
      const d = Math.random() < 0.5 ? 1 : -1;
      if (trySlide(x, y, i, d, EMPTY)) return;
      if (trySlide(x, y, i, -d, EMPTY)) return;
    }

    function updateWater(x, y, i) {
      if (y + 1 < H) {
        const below = i + W;
        if (grid[below] === EMPTY) { move(i, below); return; }   // fall
        const d = Math.random() < 0.5 ? 1 : -1;                  // diagonal
        if (trySlide(x, y, i, d, EMPTY)) return;
        if (trySlide(x, y, i, -d, EMPTY)) return;
      }
      // Otherwise spread horizontally, random direction first.
      const d = Math.random() < 0.5 ? 1 : -1;
      if (tryFlow(x, y, i, d)) return;
      if (tryFlow(x, y, i, -d)) return;
    }

    function updateAcid(x, y, i) {
      // Dissolve on direct contact (4-neighbours) with Sand or Wall:
      // both the acid and one neighbouring pixel become empty.
      const targets = [];
      if (x > 0     && (grid[i - 1] === SAND || grid[i - 1] === WALL)) targets.push(i - 1);
      if (x < W - 1 && (grid[i + 1] === SAND || grid[i + 1] === WALL)) targets.push(i + 1);
      if (y > 0     && (grid[i - W] === SAND || grid[i - W] === WALL)) targets.push(i - W);
      if (y < H - 1 && (grid[i + W] === SAND || grid[i + W] === WALL)) targets.push(i + W);
      if (targets.length && Math.random() < DISSOLVE_CHANCE) {
        const t = targets[(Math.random() * targets.length) | 0];
        grid[i] = EMPTY; grid[t] = EMPTY;
        moved[i] = frame; moved[t] = frame;
        return;
      }
      // Otherwise behave exactly like water.
      updateWater(x, y, i);
    }

    // ------------------------------------------------------------------
    // Main physics step.
    // Iterate BOTTOM -> TOP so a particle moving down lands in an
    // already-processed row and cannot fall more than one cell/frame.
    // A `moved` frame-stamp blocks re-processing after horizontal moves.
    // Horizontal scan direction is randomized per row to avoid skew.
    // ------------------------------------------------------------------
    function update() {
      frame++;
      for (let y = H - 1; y >= 0; y--) {
        const leftToRight = Math.random() < 0.5;
        const row = y * W;
        for (let xi = 0; xi < W; xi++) {
          const x = leftToRight ? xi : W - 1 - xi;
          const i = row + x;
          const m = grid[i];
          if (m === EMPTY || m === WALL) continue;
          if (moved[i] === frame) continue;   // already processed this frame
          switch (m) {
            case SAND:  updateSand(x, y, i);  break;
            case WATER: updateWater(x, y, i); break;
            case ACID:  updateAcid(x, y, i);  break;
          }
        }
      }
    }

    // ------------------------------------------------------------------
    // Render (ImageData at grid res -> scaled blit, counts piggybacked)
    // ------------------------------------------------------------------
    const counts = [0, 0, 0, 0, 0];
    function render(now) {
      counts[0] = counts[1] = counts[2] = counts[3] = counts[4] = 0;
      const data = img.data;
      for (let i = 0; i < N; i++) {
        const m = grid[i];
        counts[m]++;
        let r, g, b;
        if (m === ACID) {
          // Pulsing neon glow.
          const p = 0.5 + 0.5 * Math.sin(now * 0.006 + noise[i] * 6.2831);
          r = 85 + p * 70; g = 230 + p * 25; b = 51 + p * 60;
        } else {
          const c = RGB[m];
          const v = (noise[i] - 0.5) * 2 * (m === EMPTY ? 5 : 12);
          r = c[0] + v; g = c[1] + v; b = c[2] + v;
        }
        const o = i * 4;
        data[o]     = r < 0 ? 0 : r > 255 ? 255 : r;
        data[o + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
        data[o + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
        data[o + 3] = 255;
      }
      octx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, CANVAS, CANVAS);
    }

    // ------------------------------------------------------------------
    // Painting (mouse / touch, continuous streams while held)
    // ------------------------------------------------------------------
    const pointer = { down: false, x: 0, y: 0, px: 0, py: 0 };

    function toGrid(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const gx = Math.floor((clientX - rect.left) / rect.width * W);
      const gy = Math.floor((clientY - rect.top) / rect.height * H);
      return [gx, gy];
    }

    function paintDisk(cx, cy, r, mat) {
      const r2 = r * r;
      for (let dy = -r; dy <= r; dy++) {
        const y = cy + dy;
        if (y < 0 || y >= H) continue;
        const row = y * W;
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > r2) continue;
          const x = cx + dx;
          if (x < 0 || x >= W) continue;
          grid[row + x] = mat;
        }
      }
    }

    // Interpolated stroke so fast drags leave no gaps.
    function paintLine(x0, y0, x1, y1) {
      const dx = x1 - x0, dy = y1 - y0;
      const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
      for (let s = 0; s <= steps; s++) {
        const x = Math.round(x0 + dx * s / steps);
        const y = Math.round(y0 + dy * s / steps);
        paintDisk(x, y, brushRadius, currentMaterial);
      }
    }

    function doPaint() {
      paintLine(pointer.px, pointer.py, pointer.x, pointer.y);
      pointer.px = pointer.x; pointer.py = pointer.y;
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const [gx, gy] = toGrid(e.clientX, e.clientY);
      pointer.down = true;
      pointer.x = pointer.px = gx;
      pointer.y = pointer.py = gy;
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      doPaint();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!pointer.down) return;
      const [gx, gy] = toGrid(e.clientX, e.clientY);
      pointer.x = gx; pointer.y = gy;
    });
    function endPointer() { pointer.down = false; }
    window.addEventListener("pointerup", endPointer);
    window.addEventListener("pointercancel", endPointer);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    // ------------------------------------------------------------------
    // UI wiring
    // ------------------------------------------------------------------
    const MAT_COLORS = { 1: "var(--sand)", 2: "var(--water)", 3: "var(--wall)", 4: "var(--acid)", 0: "#b9b9c9" };
    const matButtons = Array.from(document.querySelectorAll("#materials .mat"));
    const brushCircle = document.getElementById("brushcircle");

    function setMaterial(m) {
      currentMaterial = m;
      matButtons.forEach((b) => b.classList.toggle("active", +b.dataset.m === m));
      brushCircle.style.background = MAT_COLORS[m] || "var(--sand)";
    }
    matButtons.forEach((b) => b.addEventListener("click", () => setMaterial(+b.dataset.m)));

    const brushInput = document.getElementById("brush");
    const brushVal = document.getElementById("brushval");
    function setBrush(r) {
      brushRadius = r;
      brushVal.textContent = r;
      const pct = ((r - brushInput.min) / (brushInput.max - brushInput.min)) * 100;
      brushInput.style.setProperty("--fill", pct + "%");
      // Show the radius visually (scale ~2.6px per unit of radius, capped).
      const px = Math.min(r * 2.6, 40);
      brushCircle.style.width = px + "px";
      brushCircle.style.height = px + "px";
    }
    brushInput.addEventListener("input", () => setBrush(+brushInput.value));

    document.getElementById("clear").addEventListener("click", clearGrid);

    const pauseBtn = document.getElementById("pause");
    function togglePause() {
      paused = !paused;
      pauseBtn.textContent = paused ? "Resume" : "Pause";
    }
    pauseBtn.addEventListener("click", togglePause);

    document.getElementById("reset").addEventListener("click", seed);

    // Keyboard shortcuts
    const KEYMAP = { "1": SAND, "2": WATER, "3": WALL, "4": ACID, "5": EMPTY };
    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      const k = e.key;
      if (KEYMAP[k] !== undefined) { setMaterial(KEYMAP[k]); return; }
      if (k === "c" || k === "C") { clearGrid(); return; }
      if (k === " ") { e.preventDefault(); togglePause(); return; }
    });

    // FPS + counters (throttled DOM writes)
    const fpsEl = document.getElementById("fps");
    const legendEls = {
      1: document.getElementById("c-sand"),
      2: document.getElementById("c-water"),
      3: document.getElementById("c-wall"),
      4: document.getElementById("c-acid")
    };
    document.getElementById("gridinfo").textContent = W + "×" + H;
    let frames = 0, lastFps = performance.now();
    function tickHUD(now) {
      frames++;
      if (now - lastFps >= 500) {
        const fps = Math.round((frames * 1000) / (now - lastFps));
        fpsEl.textContent = fps;
        frames = 0; lastFps = now;
        legendEls[1].textContent = counts[1];
        legendEls[2].textContent = counts[2];
        legendEls[3].textContent = counts[3];
        legendEls[4].textContent = counts[4];
      }
    }

    // ------------------------------------------------------------------
    // Demo scene
    // ------------------------------------------------------------------
    function seed() {
      clearGrid();
      const fy = Math.floor(H * 0.70);                 // basin floor
      const lx = Math.floor(W * 0.24), rx = Math.floor(W * 0.76);
      const ty = Math.floor(H * 0.54);                 // basin top
      fillRect(lx, fy, rx, fy, WALL);                  // floor
      fillRect(lx, ty, lx, fy, WALL);                  // left wall
      fillRect(rx, ty, rx, fy, WALL);                  // right wall
      // Sand pile (upper-left inside)
      fillRect(lx + 4, Math.floor(H * 0.58), Math.floor(W * 0.46), fy - 3, SAND);
      // Water (upper-right inside)
      fillRect(Math.floor(W * 0.54), Math.floor(H * 0.60), rx - 4, fy - 3, WATER);
      // Acid drop in the middle (will corrode whatever it touches)
      const ax = Math.floor(W * 0.5), ay = Math.floor(H * 0.50);
      for (let dy = -2; dy <= 2; dy++)
        for (let dx = -2; dx <= 2; dx++)
          if (dx * dx + dy * dy <= 4) grid[(ay + dy) * W + (ax + dx)] = ACID;
    }

    // ------------------------------------------------------------------
    // Main loop
    // ------------------------------------------------------------------
    function loop(now) {
      if (pointer.down) doPaint();   // paint even while paused
      if (!paused) update();
      render(now);
      tickHUD(now);
      requestAnimationFrame(loop);
    }

    // Init
    seed();
    setMaterial(SAND);
    setBrush(brushRadius);
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
